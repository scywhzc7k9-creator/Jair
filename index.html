<!DOCTYPE html>
<html lang="es">
<head>
<script>
/* Si ya hay una sesión válida, entra directo al simulador */
(function(){
  try{
    var auth = JSON.parse(localStorage.getItem('mtg_auth') || 'null');
    if(auth && auth.user){ window.location.replace('simulador.html'); }
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Máquina del Tiempo Gramatical</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #0b1220;
    --panel: #121b2e;
    --panel-2: #17233a;
    --line: rgba(237,239,245,0.10);
    --text: #edeff5;
    --text-dim: #9aa5bd;
    --era: #3fbfad;
    --bad: #ef6a6a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .login-card{
    width:100%; max-width: 380px;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius: 16px;
    padding: 28px 26px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:2px;
    color: var(--text-dim); text-transform:uppercase;
  }
  h1{
    font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700;
    margin: 6px 0 4px;
  }
  .login-card > p{ color: var(--text-dim); font-size:13px; margin-bottom:22px; }

  label{
    display:block; font-family:'JetBrains Mono', monospace; font-size:11px;
    letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px;
  }
  input{
    width:100%; background: var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding: 12px 14px; border-radius:10px; font-size:14.5px; font-family:'Inter', sans-serif;
    margin-bottom:16px;
  }
  input:focus{ outline:none; border-color: var(--era); }

  button{
    width:100%; background: var(--era); border:none; color:#0b1220; font-weight:700;
    font-family:'Space Grotesk', sans-serif; padding:13px; border-radius:10px; cursor:pointer;
    font-size:14.5px;
  }
  button:hover{ opacity:0.92; }

  .error-msg{
    display:none; background: rgba(239,106,106,0.12); border:1px solid rgba(239,106,106,0.4);
    color:#ffd6d6; font-size:12.5px; padding:10px 12px; border-radius:9px; margin-bottom:14px;
  }
  .error-msg.show{ display:block; }

  .foot-note{
    text-align:center; margin-top:18px; font-size:11.5px; color:var(--text-dim);
  }
</style>
</head>
<body>

  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="eyebrow">inglés · prepa</div>
    <h1>Máquina del Tiempo Gramatical</h1>
    <p>Inicia sesión con el usuario y la contraseña que te dio tu profesor(a).</p>

    <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos.</div>

    <label for="userInput">Usuario</label>
    <input type="text" id="userInput" placeholder="ej. alumno01" autocomplete="username">

    <label for="passInput">Contraseña</label>
    <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password">

    <button type="submit">Iniciar sesión</button>

    <div class="foot-note">Tus respuestas y avances se guardan solo en este dispositivo.</div>
  </form>

<script src="users.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const user = document.getElementById('userInput').value.trim().toLowerCase();
  const pass = document.getElementById('passInput').value;
  const errorMsg = document.getElementById('errorMsg');

  const match = USERS.find(u => u.user.toLowerCase() === user && u.pass === pass);

  if(match){
    localStorage.setItem('mtg_auth', JSON.stringify({ user: match.user, name: match.name, ts: Date.now() }));
    window.location.href = 'simulador.html';
  } else {
    errorMsg.classList.add('show');
  }
});
</script>
</body>
</html>
